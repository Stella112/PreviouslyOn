<!doctype html><html><head><meta charset="utf-8"><title>Previously On overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:system-ui,sans-serif;overflow:hidden}#stage{width:100%;height:100%;display:grid;place-items:center;text-align:center}#stage h2{font-size:7vw;color:white;text-shadow:0 3px 20px #000;background:#1a1025d9;border-radius:18px;padding:3vw}#stage video{width:100%;height:100%;object-fit:contain;grid-area:1/1}#stage p{grid-area:1/1;align-self:end;z-index:1;background:#22172bea;font-size:3vw;padding:1vw 2vw;margin:0 0 6vh;border-left:.5vw solid #c79aff}</style></head><body><div id="stage"></div><script src="/studio-assets/player.js"></script><script>let active='',controller;const stream=new EventSource('/api/events');stream.onmessage=e=>{const state=JSON.parse(e.data).playback;if(!state.playing){if(controller){controller.abort();controller=undefined;active='';document.querySelector('#stage').replaceChildren()}return}if(state.id===active)return;controller?.abort();active=state.id;controller=new AbortController();window.playEpisode(document.querySelector('#stage'),state.episode,controller.signal).then(()=>{if(active===state.id){document.querySelector('#stage').replaceChildren()}})};</script></body></html>
