<!doctype html><html><head><meta charset="utf-8"><title>Previously On overlay</title><style>@font-face{font-family:Oswald;src:url('/assets/fonts/Oswald.ttf')}html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:Oswald,system-ui,sans-serif;overflow:hidden}#stage{width:100%;height:100%;display:grid;place-items:center;text-align:center}#stage h2{font-size:7vw;color:white;text-shadow:0 3px 20px #000;background:#1a1025ed;border-radius:18px;padding:3vw;animation:arrive .45s ease both}#stage video{width:100%;height:100%;object-fit:contain;grid-area:1/1}#stage p{grid-area:1/1;justify-self:start;align-self:end;z-index:1;text-align:left;background:#22172bf2;font-weight:800;font-size:3vw;padding:1vw 2vw;margin:0 0 6vh 4vw;border-left:.5vw solid #c79aff;animation:arrive .45s ease both}#stage p small{display:block;color:#cfb5f5;font-size:1.5vw;margin-top:.3em}body.simulated:after{content:'SIMULATED';position:fixed;right:2%;top:3%;background:#7f3fb0;color:white;font-weight:800;padding:.5em 1em}@keyframes arrive{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}</style></head><body><div id="stage"></div><script src="/studio-assets/player.js"></script><script>let active='',controller;const stream=new EventSource('/api/events');stream.onmessage=e=>{const payload=JSON.parse(e.data);const state=payload.playback;document.body.classList.toggle('simulated',payload.simulated && state.playing);if(!state.playing){if(controller){controller.abort();controller=undefined;active='';document.querySelector('#stage').replaceChildren()}return}if(state.id===active)return;controller?.abort();active=state.id;controller=new AbortController();window.playEpisode(document.querySelector('#stage'),state.episode,controller.signal).then(()=>{if(active===state.id){document.querySelector('#stage').replaceChildren()}})};</script></body></html>
